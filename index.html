<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥵</text></svg>">
<style>
  :root{
    --bg:#07070d; --bg2:#0d0d18; --hot:#ff3c5a; --hot2:#ff7a45;

    --pink:#ff2e63; --pur:#9b5cff; --yel:#ffb43c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(155,92,255,.18), transparent 60%),

      var(--bg);
  }
  .stage{position:fixed;inset:0;overflow:hidden;}
  .track{display:flex;height:100%;transition:transform .55s cubic-bezier(.22,.8,.3,1);will-change:transform;}
  .screen{flex:0 0 100%;height:100%;position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vw 5vw;overflow:hidden;}

  /* ===== 单张字幕卡 ===== */
  .card{width:100%;max-width:560px;text-align:center;position:relative;}
  .em{font-size:clamp(22px,5.6vw,30px);line-height:1.75;letter-spacing:.02em;
    display:flex;flex-direction:column;gap:clamp(14px,3vh,26px);}
  .em .l{display:block;font-weight:800;}
  .em .l1{color:var(--hot);text-shadow:0 0 24px rgba(255,60,90,.45);}
  .em .l2{color:var(--hot2);text-shadow:0 0 24px rgba(255,122,69,.4);}
  .em .l3{color:var(--yel);font-size:.82em;letter-spacing:.04em;
    text-shadow:0 0 22px rgba(255,180,60,.35);}
  .em .l4{color:var(--pur);font-size:.82em;letter-spacing:.04em;
    text-shadow:0 0 22px rgba(155,92,255,.4);}
  .em .l5{color:#5cffd0;font-size:.82em;letter-spacing:.04em;
    text-shadow:0 0 22px rgba(92,255,208,.35);}
  .em .l6{color:var(--txt);font-size:1.25em;font-weight:900;margin-top:.15em;
    text-shadow:0 2px 30px rgba(255,255,255,.25);}
  .game{margin-top:clamp(22px,4vh,36px);font-size:clamp(28px,7.5vw,46px);font-weight:900;
    letter-spacing:.06em;line-height:1.15;
    background:linear-gradient(100deg,var(--hot),var(--yel) 45%,var(--pur));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 26px rgba(255,60,90,.25));}
  .num{position:absolute;top:0;left:0;font-size:clamp(60px,16vw,130px);font-weight:900;
    color:rgba(255,255,255,.045);line-height:1;pointer-events:none;font-style:italic;}

  /* ===== 封面 ===== */
  .cover .title{font-size:clamp(34px,9vw,62px);font-weight:900;line-height:1.15;
    background:linear-gradient(100deg,#fff,var(--hot) 60%,var(--yel));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .cover .sub{margin-top:clamp(16px,3vh,26px);color:var(--dim);font-size:clamp(13px,3.4vw,15px);
    letter-spacing:.14em;}
  .cover .cnt{margin-top:clamp(26px,6vh,44px);color:var(--hot);font-size:clamp(13px,3.4vw,15px);
    letter-spacing:.1em;font-weight:700;}
  .scroll-hint{position:absolute;bottom:7vh;left:50%;transform:translateX(-50%);
    color:var(--dim);font-size:12px;letter-spacing:.2em;animation:bob 1.6s ease-in-out infinite;}
  .scroll-hint::after{content:"↓";display:block;margin-top:6px;font-size:18px;color:var(--hot);}
  @keyframes bob{0%,100%{transform:translate(-50%,0);opacity:.6}50%{transform:translate(-50%,8px);opacity:1}}

  /* ===== 结尾 ===== */
  .end .t1{font-size:clamp(26px,6.4vw,40px);font-weight:900;line-height:1.5;}
  .end .t1 span{color:var(--hot);}
  .end .t2{margin-top:clamp(20px,4vh,32px);color:var(--dim);font-size:clamp(13px,3.4vw,15px);line-height:1.9;}
  .end .t3{margin-top:clamp(26px,5vh,40px);color:var(--yel);font-weight:800;font-size:clamp(14px,3.6vw,17px);
    letter-spacing:.06em;}

  .bar{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;z-index:20;
    background:linear-gradient(to top,rgba(7,7,13,.95),rgba(7,7,13,.6) 60%,transparent);}
  .dots{flex:1;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);
    transition:.3s;cursor:pointer;flex:0 0 auto;}
  .dot.on{background:var(--hot);width:22px;border-radius:5px;
    box-shadow:0 0 12px rgba(255,60,90,.6);}
  .nav{width:40px;height:40px;border-radius:50%;flex:0 0 auto;
    display:grid;place-items:center;background:rgba(255,255,255,.08);
    color:var(--txt);font-size:17px;transition:.2s;border:1px solid var(--line);}
  .nav:active{background:var(--hot);transform:scale(.9);}
  .nav[disabled]{opacity:.28;pointer-events:none;}
  .cnt-num{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;z-index:20;
    font-size:12px;color:var(--dim);letter-spacing:.1em;font-variant-numeric:tabular-nums;}
  .cnt-num b{color:var(--hot);}

  /* 入场动画 */
  .screen .card>*{opacity:0;transform:translateY(18px);transition:.6s cubic-bezier(.22,.8,.3,1);}
  .screen.in .card>*{opacity:1;transform:none;}
  .screen.in .card>*:nth-child(1){transition-delay:.05s}
  .screen.in .card>*:nth-child(2){transition-delay:.13s}
  .screen.in .card>*:nth-child(3){transition-delay:.21s}
  .screen.in .card>*:nth-child(4){transition-delay:.29s}
  .screen.in .card>*:nth-child(5){transition-delay:.37s}
  .screen.in .card>*:nth-child(6){transition-delay:.45s}
  .screen.in .card>*:nth-child(7){transition-delay:.53s}
  @media (prefers-reduced-motion:reduce){
    .track{transition:none}.screen .card>*{opacity:1;transform:none;transition:none}
  }
</style>

console.log('meme script ok, DATA len='+window.DATA.length);
const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const cntNum = document.getElementById('cntNum');

// 组装：封面 + 每条字幕 + 结尾
const screens = [
  { type:'cover' },
  ...DATA.map((d,i)=>({ type:'meme', data:d, i:i+1 })),
  { type:'end', total:DATA.length },
];

function esc(s){return s;}

screens.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'screen' + (s.type==='cover'?' cover':'') + (s.type==='end'?' end':'');
  el.dataset.idx = i;
  if(s.type==='cover'){
    el.innerHTML = `
      <div class="card">
        <div class="title">爸妈不在家<br>一个人偷偷玩</div>
        <div class="sub">游 戏 图 鉴</div>
        <div class="cnt">共 ${DATA.length} 款 · 左滑开始</div>
      </div>
      <div class="scroll-hint">左滑</div>`;
  } else if(s.type==='end'){
    el.innerHTML = `
      <div class="card">
        <div class="t1">爸妈回来了，<span>快切出去</span></div>
        <div class="t2">其实哪款游戏都不含「偷偷玩」。<br>爸妈不在家的时候，光明正大玩。</div>
        <div class="t3">— 以上 ${DATA.length} 条，纯属整活 —</div>
      </div>`;
  } else {
    el.innerHTML = `
      <div class="num">${String(s.i).padStart(2,'0')}</div>
      <div class="card">
        <div class="em">
          <span class="l l1">${s.data.l1}</span>
          <span class="l l2">${s.data.l2}</span>
          <span class="l l3">${s.data.l3}</span>
          <span class="l l4">${s.data.l4}</span>
          <span class="l l5">${s.data.l5}</span>
        </div>
        <div class="game">${s.data.g}</div>
      </div>`;
  }
  track.appendChild(el);
});

// 页码点
screens.forEach((_,i)=>{
  const d = document.createElement('button');
  d.className = 'dot' + (i===0?' on':'');
  d.setAttribute('aria-label', `第 ${i+1} 屏`);
  d.addEventListener('click', ()=>go(i));
  dotsEl.appendChild(d);
});
const dots = [...dotsEl.children];

let cur = 0;
let lock = false;
const total = screens.length;

function go(n, animate){
  n = Math.max(0, Math.min(total-1, n));
  if(n === cur && animate !== false) return;
  cur = n;
  track.style.transition = animate===false ? 'none' : '';
  track.style.transform = `translateX(${-cur*curW()}px)`;
  dots.forEach((d,i)=>d.classList.toggle('on', i===cur));
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===total-1;
  cntNum.innerHTML = `<b>${cur+1}</b> / ${total}`;
  // 入场动画：先清后加，强制重排
  document.querySelectorAll('.screen.in').forEach(e=>e.classList.remove('in'));
  const curEl = track.children[cur];
  void curEl.offsetWidth;
  curEl.classList.add('in');
}
document.getElementById('prev').addEventListener('click', ()=>go(cur-1));
document.getElementById('next').addEventListener('click', ()=>go(cur+1));

// 键盘
window.addEventListener('keydown', (e)=>{
  if(['ArrowRight','ArrowDown',' '].includes(e.key)){ e.preventDefault(); go(cur+1); }
  if(['ArrowLeft','ArrowUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  if(e.key==='Home') go(0);
  if(e.key==='End') go(total-1);
});

// 触摸滑动
let sx=null, sy=null, dx=0, lockDir=null, w=0;
const stage = document.getElementById('stage');
function onStart(e){
  if(lock) return;
  const t = e.touches ? e.touches[0] : e;
  sx = t.clientX; sy = t.clientY; dx = 0; lockDir = null;
  w = stage.clientWidth || 1;
  track.style.transition = 'none';
}
function curW(){ return stage.clientWidth || window.innerWidth; }
function onMove(e){
  if(sx==null) return;
  const t = e.touches ? e.touches[0] : e;
  dx = t.clientX - sx;
  const dy = t.clientY - sy;
  if(lockDir==null){
    if(Math.abs(dx)<8 && Math.abs(dy)<8) return;
    lockDir = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
  }
  if(lockDir!=='x') return;
  if(e.cancelable) e.preventDefault();
  track.style.transform = `translateX(${-cur*curW() + dx}px)`;
}
function onEnd(){
  if(sx==null) return;
  track.style.transition = '';
  if(lockDir==='x' && Math.abs(dx) > curW()*0.16){
    go(cur + (dx<0 ? 1 : -1));
  } else {
    go(cur, false);
  }
  sx = null;
}
stage.addEventListener('touchstart', onStart, {passive:true});
stage.addEventListener('touchmove', onMove, {passive:false});
stage.addEventListener('touchend', onEnd, {passive:true});
stage.addEventListener('touchcancel', onEnd, {passive:true});

// 鼠标拖拽
let mx=null;
stage.addEventListener('mousedown', e=>{
  if(e.target.closest('.nav, .dot')) return;
  onStart(e); mx = true;
});
window.addEventListener('mousemove', e=>{ if(mx) onMove(e); });
window.addEventListener('mouseup', ()=>{ if(mx){ mx=false; onEnd(); } });

// 滚轮：防抖，横滚也算
let wheelLock = false;
stage.addEventListener('wheel', e=>{
  if(wheelLock) return;
  const horiz = Math.abs(e.deltaX) > Math.abs(e.deltaY);
  const d = horiz ? e.deltaX : e.deltaY;
  if(Math.abs(d) < 30) return;
  wheelLock = true;
  go(cur + (d>0 ? 1 : -1));
  setTimeout(()=>wheelLock=false, 700);
}, {passive:true});

// 可见性变化 / 窗口尺寸改变：按新宽度重排，否则旋转后位移错位
window.addEventListener('resize', ()=>go(cur, false));
window.addEventListener('orientationchange', ()=>{ setTimeout(()=>go(cur, false), 120); });

go(0, false);
</script>
